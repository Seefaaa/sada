name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      biome: ${{ steps.filter.outputs.biome }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - Cargo.lock
              - rust-toolchain.toml
              - rustfmt.toml
              - .cargo/**
              - sada-byondapi/include/**
              - .github/workflows/ci.yml
            web:
              - sada-web/**
              - package.json
              - bun.lock
              - .github/workflows/ci.yml
            biome:
              - '**/*.ts'
              - '**/*.css'
              - '**/*.json'
              - biome.json
              - bun.lock
              - .github/workflows/ci.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.biome == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and linting
        run: bun run check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-26
          components: clippy, rustfmt
          targets: i686-unknown-linux-gnu, x86_64-pc-windows-msvc

      - name: Install 32-bit linker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Clippy (Windows target)
        run: cargo clippy --workspace --exclude sada-server --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --locked --all-features

      - name: Build client (32-bit)
        run: cargo build -p sada-client --target i686-unknown-linux-gnu --locked

      - name: Run tests
        run: cargo test --workspace --locked --all-features

  windows:
    name: Windows
    runs-on: windows-latest
    needs: [changes, rust]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-26

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked --all-features

      - name: Run tests
        run: cargo test --workspace --locked --all-features

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: sada-web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check and build
        run: bun run build

  completion-gate:
    name: Completion gate
    runs-on: ubuntu-latest
    needs: [changes, lint, rust, windows, web]
    if: always() && !cancelled()
    steps:
      - name: Collect job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
