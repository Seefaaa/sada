[package]
name = "sada-server"
version.workspace = true
edition.workspace = true

[dependencies]
axum.workspace = true
futures-util.workspace = true
rustc-hash.workspace = true
sada-common.workspace = true
sada-ipc.workspace = true
sada-utils = { workspace = true, features = ["shutdown"] }
serde.workspace = true
serde_json.workspace = true
str0m.workspace = true
systemstat.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
hound = { workspace = true, optional = true }
opus = { workspace = true, optional = true }

[dev-dependencies]
ratatui = { version = "0.30.2", features = ["crossterm"] }

[features]
default = []
audio_dump = ["dep:hound", "dep:opus"]

[lints]
workspace = true
